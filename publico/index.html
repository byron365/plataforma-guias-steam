<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guías STEAM · Inicio</title>
  <meta name="theme-color" content="#0E1015">
  <link rel="icon" href="/img/icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/estilos.css">
  <link rel="stylesheet" href="/css/tema-oscuro.css">
  <script src="/js/tema.js"></script>
</head>
<body>
  <header class="cabecera">
    <div class="contenedor">
      <a class="marca" href="/">
        <img src="/img/logo-cabecera.jpg" alt="" width="71" height="48" onerror="this.hidden = true">
        <span class="marca-texto">STEAM Robotics Academy<small>Guías de proyecto</small></span>
      </a>
    </div>
  </header>

  <main>
    <section class="portada">
      <div class="contenedor portada-contenido">
        <div>
          <h1>¡Hola, <span>equipo</span>!</h1>
          <p>Elijan su proyecto, su equipo y escriban el PIN que les dio el docente.</p>
        </div>
        <img class="logo-portada" src="/img/logo-portada.jpg" width="700" height="494"
             alt="STEAM Robotics Academy: Robotics, Artificial Intelligence &amp; Disruptive Technologies"
             onerror="this.hidden = true">
      </div>
    </section>

    <div class="contenedor">
      <div id="continuar" class="continuar" hidden></div>
      <h2 class="titulo-seccion">Proyectos</h2>
      <div id="proyectos" class="tarjetas" aria-live="polite">
        <p class="cargando">Cargando proyectos…</p>
      </div>
    </div>
  </main>

  <!-- Ventana para entrar: equipo → PIN → nombre -->
  <dialog id="ventana-entrar" class="ventana" aria-labelledby="ventana-titulo">
    <div class="ventana-cabecera">
      <h2 id="ventana-titulo">Entrar</h2>
      <button type="button" class="ventana-cerrar" data-cerrar aria-label="Cerrar">×</button>
    </div>
    <div class="ventana-cuerpo" id="ventana-cuerpo"></div>
  </dialog>

  <footer class="pie">STEAM Robotics Academy · <a class="enlace-pie" href="/docente">Panel del docente</a></footer>
  <script type="module" src="/js/inicio.js"></script>
</body>
</html>
